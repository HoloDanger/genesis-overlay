name: Release Genesis Overlay
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri'

      - name: Ensure Sidecar Binaries Exist
        shell: bash
        run: |
          BIN_DIR="src-tauri/binaries"
          mkdir -p "$BIN_DIR"
          for name in genesis-formatter-x86_64-pc-windows-msvc.exe genesis-formatter-x86_64-apple-darwin genesis-formatter-aarch64-apple-darwin genesis-formatter-x86_64-unknown-linux-gnu; do
            if [ ! -s "$BIN_DIR/$name" ]; then
              echo '#!/usr/bin/env python3' > "$BIN_DIR/$name"
            fi
          done
          ls -la "$BIN_DIR"

      - name: Build Tauri App & Create Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: '.'
          tagName: v__VERSION__
          releaseName: 'Genesis Overlay v__VERSION__'
          releaseBody: 'Sovereign Desktop AI Command Center (Tauri + Rust + TS)'
          releaseDraft: false
          prerelease: false
